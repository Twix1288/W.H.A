# W.H.Agent rule pack — hardcoded secrets / credentials.
#
# High-confidence provider-prefixed credential patterns. Shared by scan / check /
# guard so a Bash command or a Write of code carrying a live key is caught at
# runtime, not only by `scan`. (These mirror the vetted patterns in
# core-scanner/rules/secrets.ts; the low-precision generic ones — bare
# password=/Bearer — live only in the strict profile to avoid false positives.)
version: 1
category: secret
rules:
  - id: SEC-ANTHROPIC
    pattern: 'sk-ant-[a-zA-Z0-9_-]{20,}'
    title: Anthropic API key
    severity: critical
    confidence: 0.98
    tags: [credential]
  - id: SEC-OPENAI-PROJECT
    pattern: 'sk-proj-[a-zA-Z0-9_-]{20,}'
    title: OpenAI project key
    severity: critical
    confidence: 0.95
    tags: [credential]
  - id: SEC-OPENAI-LEGACY
    pattern: 'sk-(?!ant-|proj-)[a-zA-Z0-9]{32,}'
    title: OpenAI API key (legacy form)
    severity: high
    confidence: 0.8
    tags: [credential]
  - id: SEC-AWS-ACCESS-KEY
    pattern: '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[0-9A-Z]{16}\b'
    title: AWS access key id
    severity: critical
    confidence: 0.9
    tags: [credential]
  - id: SEC-AWS-SECRET
    pattern: '(?:aws_secret_access_key|aws_secret_key)\s*[=:]\s*["'']?[A-Za-z0-9/+=]{40}["'']?'
    flags: i
    title: AWS secret access key
    severity: critical
    confidence: 0.85
    tags: [credential]
  - id: SEC-GITHUB-PAT
    pattern: '\bghp_[a-zA-Z0-9]{36,}\b'
    title: GitHub personal access token
    severity: critical
    confidence: 0.95
    tags: [credential]
  - id: SEC-GITHUB-FINEGRAINED
    pattern: '\bgithub_pat_[a-zA-Z0-9_]{20,}'
    title: GitHub fine-grained token
    severity: critical
    confidence: 0.95
    tags: [credential]
  - id: SEC-GOOGLE-API
    pattern: '\bAIza[a-zA-Z0-9_-]{35}\b'
    title: Google API key
    severity: high
    confidence: 0.9
    tags: [credential]
  - id: SEC-STRIPE
    pattern: '\b(?:sk|rk)_(?:test|live)_[a-zA-Z0-9]{24,}'
    title: Stripe secret key
    severity: critical
    confidence: 0.95
    tags: [credential]
  - id: SEC-SLACK
    pattern: '\bxox[bprsao]-[a-zA-Z0-9-]{10,}'
    title: Slack token
    severity: high
    confidence: 0.9
    tags: [credential]
  - id: SEC-NPM
    pattern: '\bnpm_[a-zA-Z0-9]{36,}\b'
    title: npm access token
    severity: high
    confidence: 0.9
    tags: [credential]
  - id: SEC-PRIVATE-KEY
    pattern: '-----BEGIN\s+(?:RSA\s+|EC\s+|DSA\s+|OPENSSH\s+)?PRIVATE\s+KEY-----'
    title: Private key material
    severity: critical
    confidence: 0.95
    tags: [credential]
  - id: SEC-JWT
    pattern: '\beyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'
    title: JSON Web Token
    severity: medium
    confidence: 0.7
    tags: [credential]
    profiles: [default, strict]
  - id: SEC-DB-URL-CREDS
    pattern: '(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|redis|amqp):\/\/[^\s"'':/]+:[^\s"''@]+@'
    flags: i
    title: Database URL with embedded credentials
    severity: high
    confidence: 0.8
    tags: [credential]
  # ── strict-only (higher false-positive rate) ──
  - id: SEC-GENERIC-PASSWORD
    pattern: '(?:password|passwd|pwd)\s*[=:]\s*["''][^"'']{6,}["'']'
    flags: i
    title: Hardcoded password assignment
    severity: medium
    confidence: 0.5
    tags: [credential]
    profiles: [strict]
  - id: SEC-BEARER
    pattern: '["'']?[Bb]earer\s+[a-zA-Z0-9._-]{20,}["'']?'
    title: Hardcoded bearer token
    severity: medium
    confidence: 0.5
    tags: [credential]
    profiles: [strict]
