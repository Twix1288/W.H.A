name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      - run: pnpm turbo type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test

  sandbox-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/sandbox-service/go.mod
      - name: Build (packages + wh-sandbox binary)
        working-directory: packages/sandbox-service
        run: |
          go build ./...
          mkdir -p ../cli/bin
          go build -o ../cli/bin/wh-sandbox ./cmd/wh-sandbox
      - name: Vet
        working-directory: packages/sandbox-service
        run: go vet ./...
      - name: Test
        working-directory: packages/sandbox-service
        run: go test ./...

  # The OS sandbox only provides real isolation on macOS, so validate the actual
  # `run` path (build + Seatbelt tests) on a macOS runner in addition to the Linux
  # compile check above.
  sandbox-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/sandbox-service/go.mod
      - name: Build wh-sandbox binary
        working-directory: packages/sandbox-service
        run: |
          mkdir -p ../cli/bin
          go build -o ../cli/bin/wh-sandbox ./cmd/wh-sandbox
      - name: Test (Seatbelt isolation)
        working-directory: packages/sandbox-service
        run: go test ./...
