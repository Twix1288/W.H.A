[project]
name = "wh-agent-guardrail"
version = "0.1.0"
description = "W.H.Agent backend-free guardrail: screens RAG documents / untrusted text for prompt-injection risk in-process. Experimental."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wh_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
